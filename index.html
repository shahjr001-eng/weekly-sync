<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weekly Sync</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 28px; }
    h1 { margin: 0 0 10px; font-size: 44px; }
    .sub { color: #666; margin-bottom: 22px; }
    .card { border: 1px solid #e5e5e5; border-radius: 14px; padding: 18px; margin: 14px 0; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    label { display: block; font-size: 14px; color: #444; margin: 14px 0 6px; }
    input { width: min(760px, 100%); padding: 12px 14px; border-radius: 12px; border: 1px solid #d6d6d6; font-size: 16px; }
    button { padding: 12px 18px; border-radius: 14px; border: 1px solid #111; background: #fff; cursor: pointer; font-size: 16px; }
    button.primary { background: #111; color: #fff; }
    pre { background: #111; color: #fff; padding: 14px; border-radius: 14px; overflow: auto; min-height: 70px; }
    .muted { color: #777; font-size: 13px; }
  </style>
</head>

<body>
  <h1>Weekly Sync</h1>
  <div class="sub">Тест подключения GitHub Pages → Apps Script (JSONP)</div>

  <div class="card">
    <h2 style="margin:0 0 8px;">Настройки</h2>

    <label for="webapp">WebApp URL (должен заканчиваться на /exec)</label>
    <input id="webapp" placeholder="https://script.google.com/macros/s/AKfy.../exec" />

    <label for="secret">SECRET_KEY (не вставляй в код репо, только сюда)</label>
    <input id="secret" placeholder="например Шаха Биз" />

    <div class="row" style="margin-top:14px;">
      <button id="save" type="button">Сохранить</button>
      <button id="ping" type="button" class="primary">Ping</button>
      <button id="list" type="button" class="primary">List (limit=20)</button>
      <button id="test" type="button">Тест JS</button>
    </div>

    <div class="muted" style="margin-top:10px;">
      Сейчас мы проверяем, что JS исполняется и клики работают. JSONP подключим следующим шагом.
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 8px;">Ответ</h2>
    <pre id="out">-</pre>
  </div>

  <script>
    // ====== Мини-настройки и вывод ======
    const LS = 'weekly_sync_cfg_v1';

    function setOut(text) {
      const out = document.getElementById('out');
      if (!out) return;
      out.textContent = String(text);
    }

    function setOutJson(obj) {
      setOut(typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2));
    }

    function getCfg() {
      try { return JSON.parse(localStorage.getItem(LS) || '{}'); }
      catch { return {}; }
    }

    function saveCfg(cfg) {
      localStorage.setItem(LS, JSON.stringify(cfg || {}));
    }

    function readInputs() {
      return {
        webapp: (document.getElementById('webapp')?.value || '').trim(),
        secret: (document.getElementById('secret')?.value || '').trim(),
      };
    }

    function fillInputsFromCfg() {
      const cfg = getCfg();
      const webapp = document.getElementById('webapp');
      const secret = document.getElementById('secret');
      if (webapp && cfg.webapp) webapp.value = cfg.webapp;
      if (secret && cfg.secret) secret.value = cfg.secret;
    }

    // ====== Старт ======
    window.addEventListener('DOMContentLoaded', () => {
      console.log('JS LOADED');
      setOut('JS LOADED');

      fillInputsFromCfg();

      const btnSave = document.getElementById('save');
      const btnPing = document.getElementById('ping');
      const btnList = document.getElementById('list');
      const btnTest = document.getElementById('test');

      console.log({ btnSave, btnPing, btnList, btnTest });

      btnTest?.addEventListener('click', () => setOut('TEST OK'));

      btnSave?.addEventListener('click', () => {
        const cfg = readInputs();
        saveCfg(cfg);
        setOutJson({ ok: true, saved: true, cfg: { webapp: cfg.webapp, secret: cfg.secret ? '***' : '' } });
      });

      function jsonp(url, params) {
  return new Promise((resolve, reject) => {
    const cbName = '_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    window[cbName] = (data) => { cleanup(); resolve(data); };

    const qs = Object.entries({ ...params, callback: cbName })
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v ?? ''))
      .join('&');

    const s = document.createElement('script');
    s.src = url + (url.includes('?') ? '&' : '?') + qs;
    s.async = true;

    const t = setTimeout(() => { cleanup(); reject(new Error('JSONP timeout')); }, 12000);

    function cleanup() {
      clearTimeout(t);
      try { delete window[cbName]; } catch {}
      if (s.parentNode) s.parentNode.removeChild(s);
    }

    s.onerror = () => { cleanup(); reject(new Error('JSONP load error')); };
    document.body.appendChild(s);
  });
}

btnPing?.addEventListener('click', async () => {
 btnList?.addEventListener('click', async () => {
  alert('LIST CLICK'); // временно для теста
  ...
});

  const cfg = readInputs();
  if (!cfg.webapp || !cfg.webapp.endsWith('/exec')) return setOut('Вставь WebApp URL (…/exec)');
  if (!cfg.secret) return setOut('Вставь SECRET_KEY');

  setOut('LIST...');
  try {
    const res = await jsonp(cfg.webapp, { action: 'list', key: cfg.secret, limit: 20 });
    setOutJson(res);
  } catch (e) {
    setOut(String(e));
  }
});

  const cfg = readInputs();
  if (!cfg.webapp || !cfg.webapp.endsWith('/exec')) return setOut('Вставь WebApp URL (…/exec)');
  if (!cfg.secret) return setOut('Вставь SECRET_KEY');

  setOut('PING…');
  try {
    const res = await jsonp(cfg.webapp, { action: 'ping', key: cfg.secret });
    setOutJson(res);
  } catch (e) {
    setOut(String(e));
  }
});

    });
  </script>
</body>
</html>
